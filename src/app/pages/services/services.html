<app-page-hero
  title="Services"
  tagline="Four practices, each led by a specialist"
  image="/images/hero-services.jpg"
/>

<div class="container">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a routerLink="/">Home</a>
    <span aria-hidden="true">&rsaquo;</span>
    <span class="breadcrumb__current">Services</span>
  </nav>
</div>

<section class="section">
  <div class="container">
    <app-section-heading
      align="left"
      eyebrow="Our capabilities"
      heading="Choose a starting point"
      description="We deliberately keep our scope narrow. Select a practice to see what a typical engagement involves and who leads it."
    />
    <div class="grid grid--3">
      @for (service of services(); track service.slug; let i = $index) {
        <app-service-card [service]="service" [index]="(i + 1).toString().padStart(2, '0')" />
      }
    </div>
  </div>
</section>

<app-cta-banner
  heading="Not sure where to start?"
  description="Tell us about the challenge and we will suggest the right first engagement."
/>
