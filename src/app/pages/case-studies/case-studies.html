<app-page-hero
  title="Case studies"
  tagline="Proof, not promises"
  image="/images/hero-case-studies.jpg"
/>

<section class="section">
  <div class="container studies">
    @for (study of caseStudies(); track study.slug) {
      <article class="study">
        <div class="study__meta">
          {{ study.industry }}
          <span>{{ study.client }}</span>
        </div>
        <div>
          <h2 class="accent-cap">{{ study.title }}</h2>
          <p>{{ study.summary }}</p>
          <ul class="study__results">
            @for (result of study.results; track result.label) {
              <li><strong>{{ result.value }}</strong><span>{{ result.label }}</span></li>
            }
          </ul>
        </div>
      </article>
    }
  </div>
</section>

<app-cta-banner heading="Want results like these?" />
